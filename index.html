<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDR Music Trainer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; color: #00d4ff; }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: #16213e;
            color: #eee;
            cursor: pointer;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
        }
        button:hover { background: #00b8e0; }
        #canvas {
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: #0f0f1e;
        }
        #keyboard {
            margin-top: 20px;
            display: flex;
            gap: 2px;
        }
        .key {
            width: 40px;
            height: 120px;
            background: white;
            border: 1px solid #333;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: background 0.1s;
        }
        .key.black {
            width: 24px;
            height: 75px;
            background: #222;
            margin: 0 -12px;
            z-index: 1;
        }
        .key.active { background: #00d4ff; }
        .key.black.active { background: #0088aa; }
        #score {
            font-size: 24px;
            margin: 10px 0;
            color: #00ff88;
        }
        .info { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎹 DDR Music Trainer</h1>
    <p class="info">Practice scales and chords with falling notes</p>
    
    <div class="controls">
        <select id="scaleSelect">
            <option value="C major">C Major</option>
            <option value="D dorian">D Dorian (Uptown Funk)</option>
            <option value="A minor">A Minor</option>
            <option value="G major">G Major</option>
            <option value="F major">F Major</option>
        </select>
        <select id="modeSelect">
            <option value="scale">Scale Practice</option>
            <option value="chord">Chord Practice</option>
        </select>
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>
    
    <div id="score">Score: <span id="scoreValue">0</span></div>
    
    <canvas id="canvas" width="600" height="400"></canvas>
    
    <div id="keyboard"></div>
    
    <p class="info">Click keys or use your keyboard (A-L keys)</p>

    <script>
        // Note frequencies (C4 to C5)
        const noteFrequencies = {
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
            'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
            'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
            'C5': 523.25
        };

        const noteNames = ['C4', 'C#4', 'D4', 'D#4', 'E4', 'F4', 'F#4', 'G4', 'G#4', 'A4', 'A#4', 'B4', 'C5'];
        const whiteKeys = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
        const blackKeys = ['C#4', 'D#4', 'F#4', 'G#4', 'A#4'];

        // Scale definitions
        const scales = {
            'C major': ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'],
            'D dorian': ['D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5'],
            'A minor': ['A4', 'B4', 'C5', 'D5', 'E5', 'F5', 'G5', 'A5'],
            'G major': ['G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F#5', 'G5'],
            'F major': ['F4', 'G4', 'A4', 'Bb4', 'C5', 'D5', 'E5', 'F5']
        };

        // Chord definitions (for chord practice mode)
        const chords = {
            'C major': [['C4', 'E4', 'G4'], ['F4', 'A4', 'C5'], ['G4', 'B4', 'D5'], ['C4', 'E4', 'G4']],
            'D dorian': [['D4', 'F4', 'A4'], ['G4', 'B4', 'D5'], ['A4', 'C5', 'E5'], ['D4', 'F4', 'A4']],
            'A minor': [['A4', 'C5', 'E5'], ['D5', 'F5', 'A5'], ['E5', 'G5', 'B5'], ['A4', 'C5', 'E5']],
            'G major': [['G4', 'B4', 'D5'], ['C5', 'E5', 'G5'], ['D5', 'F#5', 'A5'], ['G4', 'B4', 'D5']],
            'F major': [['F4', 'A4', 'C5'], ['Bb4', 'D5', 'F5'], ['C5', 'E5', 'G5'], ['F4', 'A4', 'C5']]
        };

        let synth;
        let isPlaying = false;
        let notes = [];
        let score = 0;
        let lastTime = 0;
        let noteSpeed = 2;
        let spawnRate = 800;
        let lastSpawn = 0;
        let currentScale = [];
        let currentChords = [];
        let chordIndex = 0;
        let activeKeys = new Set();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreValue = document.getElementById('scoreValue');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const scaleSelect = document.getElementById('scaleSelect');
        const modeSelect = document.getElementById('modeSelect');
        const keyboard = document.getElementById('keyboard');

        // Create keyboard
        function createKeyboard() {
            keyboard.innerHTML = '';
            
            // White keys
            whiteKeys.forEach(note => {
                const key = document.createElement('div');
                key.className = 'key';
                key.dataset.note = note;
                key.addEventListener('mousedown', () => playNote(note));
                key.addEventListener('mouseup', () => releaseNote(note));
                key.addEventListener('mouseleave', () => releaseNote(note));
                keyboard.appendChild(key);
            });
            
            // Black keys (positioned absolutely)
            blackKeys.forEach(note => {
                const key = document.createElement('div');
                key.className = 'key black';
                key.dataset.note = note;
                key.addEventListener('mousedown', () => playNote(note));
                key.addEventListener('mouseup', () => releaseNote(note));
                key.addEventListener('mouseleave', () => releaseNote(note));
                keyboard.appendChild(key);
            });
        }

        function playNote(note) {
            if (!synth) synth = new Tone.Synth().toDestination();
            synth.triggerAttack(noteFrequencies[note]);
            activeKeys.add(note);
            updateKeyboard();
            
            // Check if note is correct
            if (isPlaying) {
                checkHit(note);
            }
        }

        function releaseNote(note) {
            if (synth) synth.triggerRelease();
            activeKeys.delete(note);
            updateKeyboard();
        }

        function updateKeyboard() {
            document.querySelectorAll('.key').forEach(key => {
                const note = key.dataset.note;
                key.classList.toggle('active', activeKeys.has(note));
            });
        }

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4',
                'f': 'F4', 't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4',
                'u': 'A#4', 'j': 'B4', 'k': 'C5'
            };
            const note = keyMap[e.key.toLowerCase()];
            if (note && !activeKeys.has(note)) {
                playNote(note);
            }
        });

        document.addEventListener('keyup', (e) => {
            const keyMap = {
                'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4',
                'f': 'F4', 't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4',
                'u': 'A#4', 'j': 'B4', 'k': 'C5'
            };
            const note = keyMap[e.key.toLowerCase()];
            if (note) releaseNote(note);
        });

        function checkHit(note) {
            for (let i = 0; i < notes.length; i++) {
                const n = notes[i];
                if (n.name === note && n.y > 320 && n.y < 380) {
                    score += 100;
                    scoreValue.textContent = score;
                    notes.splice(i, 1);
                    break;
                }
            }
        }

        function spawnNote() {
            const mode = modeSelect.value;
            let noteName;
            
            if (mode === 'scale') {
                noteName = currentScale[Math.floor(Math.random() * currentScale.length)];
            } else {
                const chord = currentChords[chordIndex % currentChords.length];
                noteName = chord[Math.floor(Math.random() * chord.length)];
                chordIndex++;
            }
            
            notes.push({
                name: noteName,
                y: 0,
                x: noteNames.indexOf(noteName) * 46 + 23
            });
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw target line
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 350);
            ctx.lineTo(canvas.width, 350);
            ctx.stroke();
            
            // Update and draw notes
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                note.y += noteSpeed;
                
                // Draw note
                ctx.fillStyle = '#00d4ff';
                ctx.fillRect(note.x - 15, note.y, 30, 20);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(note.name, note.x - 12, note.y + 14);
                
                // Remove if missed
                if (note.y > 400) {
                    notes.splice(i, 1);
                    score = Math.max(0, score - 50);
                    scoreValue.textContent = score;
                }
            }
            
            // Spawn new notes
            if (timestamp - lastSpawn > spawnRate) {
                spawnNote();
                lastSpawn = timestamp;
            }
            
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            const scaleName = scaleSelect.value;
            currentScale = scales[scaleName];
            currentChords = chords[scaleName] || chords['C major'];
            chordIndex = 0;
            
            if (!synth) synth = new Tone.Synth().toDestination();
            
            isPlaying = true;
            notes = [];
            score = 0;
            scoreValue.textContent = score;
            lastSpawn = 0;
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            
            requestAnimationFrame(gameLoop);
        }

        function stopGame() {
            isPlaying = false;
            notes = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        startBtn.addEventListener('click', startGame);
        stopBtn.addEventListener('click', stopGame);

        // Initialize
        createKeyboard();
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 350);
        ctx.lineTo(canvas.width, 350);
        ctx.stroke();
    </script>
</body>
</html>
